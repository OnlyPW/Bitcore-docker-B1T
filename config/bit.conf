# Bit Core Configuration Template
# Copy this file to your data directory and customize as needed

# Network settings
server=1
daemon=0
txindex=1
addressindex=1
timestampindex=1
spentindex=1

# RPC settings
rpcuser=user
rpcpassword=changeme
rpcallowip=0.0.0.0/0
rpcbind=0.0.0.0
rpcport=8332

# Network connectivity
listen=1
port=8333
maxconnections=125

# Logging
debug=0
printtoconsole=1

# Performance
dbcache=256
maxmempool=300

# Optional: Testnet/Regtest
# testnet=1
# regtest=1

# Optional: Additional settings
# wallet=wallet.dat
# backupdir=/data/backups
# datadir=/data
